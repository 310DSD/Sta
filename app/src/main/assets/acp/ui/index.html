<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#f7f6f1">
  <title>ACP Workspace</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.6-9.6a4 4 0 0 1 5.7 5.7l-9.6 9.6a2 2 0 0 1-2.8-2.8l8.9-8.9"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m5 7 4 5-4 5M12 17h7"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></symbol>
    <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9.5 4A3.5 3.5 0 0 0 6 7.5v.3A3.5 3.5 0 0 0 4 14a3.5 3.5 0 0 0 4.5 4.8A3.5 3.5 0 0 0 12 21V4.8A3 3 0 0 0 9.5 4ZM14.5 4A3.5 3.5 0 0 1 18 7.5v.3A3.5 3.5 0 0 1 20 14a3.5 3.5 0 0 1-4.5 4.8A3.5 3.5 0 0 1 12 21"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5L9 6.1a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L5 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.5 3.1h5l.5-3.1a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1Z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3L3 11M3 5v6h6M4 13a8 8 0 0 0 14.9 3L21 13M21 19v-6h-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/></symbol>
    <symbol id="i-git" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="19" r="2"/><path d="M6 7v10M8 7h4a6 6 0 0 0 6-6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.7 9.7 0 0 1-3.8-.8L3 21l1.7-4.6A8.4 8.4 0 1 1 21 11.5Z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 3 20h18zM12 9v5M12 17h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 16-4.5-4.5L7 21"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V5a1.5 1.5 0 0 1 3 0v6-8a1.5 1.5 0 0 1 3 0v8-6.5a1.5 1.5 0 0 1 3 0V14c0 4-2.5 7-6.5 7S4 18 4 14v-3a1.5 1.5 0 0 1 3 0v2"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></symbol>
  </svg>

  <div class="app" id="app" data-agent="claude" data-theme="light">
    <div class="floor"></div>
    <div class="scrim" id="scrim"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
          <span class="brand-copy">
            <strong id="brandName">Claude Code</strong>
            <small id="brandSub">local workspace</small>
          </span>
        </div>
        <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="关闭侧栏"><svg class="icon"><use href="#i-x"/></svg></button>
      </div>

      <button class="new-thread" id="newSession">
        <span class="new-thread-icon"><svg class="icon"><use href="#i-plus"/></svg></span>
        <span>新建会话</span>
        <kbd>⌘ N</kbd>
      </button>

      <div class="sidebar-scroll">
        <div class="list-head">
          <span id="sessionGroupLabel">最近</span>
          <span class="list-count" id="sessionCount"></span>
        </div>
        <div class="session-list" id="sessionList"></div>
      </div>

      <div class="sidebar-foot">
        <div class="agent-switch" role="tablist" aria-label="切换 Agent">
          <button class="agent-choice" data-agent="claude" role="tab">
            <span class="agent-choice-mark claude-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10.95h3v3.1h-3v3.03h-1.49V20H18v-2.92h-1.49V20H15v-2.92H9V20H7.49v-2.92H6V20H4.49v-2.92H3V14.05H0v-3.1h3V5h18v5.95ZM6 10.95h1.49V8.1H6v2.85Zm10.51 0H18V8.1h-1.49v2.85Z" fill="currentColor"/></svg></span>
            <span>Claude</span>
          </button>
          <button class="agent-choice" data-agent="codex" role="tab">
            <span class="agent-choice-mark codex-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.06 3.34a4.58 4.58 0 0 1 2.29-.31c1 .11 1.89.54 2.67 1.27a.1.1 0 0 0 .08.03 4.55 4.55 0 0 1 3.05.27l.05.02.11.06a4.58 4.58 0 0 1 2.19 2.4c.21.51.31 1.04.31 1.59 0 .42-.04.83-.13 1.23a.12.12 0 0 0 .03.11 4.47 4.47 0 0 1 1.18 2.17c.29 1.43 0 2.71-.88 3.85l-.14.17a4.55 4.55 0 0 1-2.2 1.39.12.12 0 0 0-.08.08c-.19.55-.38 1.02-.74 1.49a4.5 4.5 0 0 1-3.71 1.84 4.5 4.5 0 0 1-3.16-1.3.1.1 0 0 0-.1-.02c-.39.12-.78.14-1.2.13a4.44 4.44 0 0 1-1.95-.46 4.54 4.54 0 0 1-1.61-1.34c-.15-.2-.3-.39-.41-.62a5.8 5.8 0 0 1-.37-.96 4.58 4.58 0 0 1-.01-2.3.12.12 0 0 0 .01-.05.08.08 0 0 0-.03-.05 4.47 4.47 0 0 1-1.03-1.65 3.9 3.9 0 0 1-.25-1.19 5.19 5.19 0 0 1 .14-1.6c.34-1.11.98-1.98 1.93-2.62.21-.14.41-.25.6-.33.22-.09.43-.16.65-.23a.1.1 0 0 0 .06-.06 4.5 4.5 0 0 1 .83-1.62 4.54 4.54 0 0 1 1.84-1.39Zm3.48 10.57a.64.64 0 1 0 0 1.27h3.64a.64.64 0 1 0 0-1.27h-3.64ZM8.46 9.23a.64.64 0 0 0-1.1.63l1.27 2.22-1.27 2.14a.64.64 0 0 0 1.1.65l1.45-2.46a.64.64 0 0 0 0-.64L8.46 9.23Z" fill="currentColor"/></svg></span>
            <span>Codex</span>
          </button>
        </div>
        <button class="account-row" id="accountRow">
          <span class="account-state" id="accountState"><i></i></span>
          <span class="account-copy">
            <strong id="accountLabel">检查账号…</strong>
            <small id="accountSub">CLI 登录状态</small>
          </span>
          <svg class="icon"><use href="#i-chevron-right"/></svg>
        </button>
        <button class="theme-row" id="themeButton">
          <svg class="icon theme-icon"><use href="#i-moon"/></svg>
          <span id="themeLabel">深色外观</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuButton" aria-label="打开侧栏"><svg class="icon"><use href="#i-menu"/></svg></button>
        <div class="title-stack">
          <div class="title-line">
            <span class="title-agent" id="agentLabel">Claude Code</span>
            <button class="workspace-pill" id="cwdChip" title="更改工作目录">
              <svg class="icon"><use href="#i-folder"/></svg>
              <span id="cwdLabel">root</span>
              <svg class="icon chevron"><use href="#i-chevron-down"/></svg>
            </button>
          </div>
          <div class="session-title" id="sessionLabel">新会话</div>
        </div>
        <div class="top-actions">
          <span class="connection" id="connection" title="ACP 连接状态"><i></i><span>连接中</span></span>
          <button class="icon-btn" id="newSessionTop" aria-label="新建会话"><svg class="icon"><use href="#i-plus"/></svg></button>
          <button class="icon-btn" id="moreButton" aria-label="更多"><svg class="icon"><use href="#i-more"/></svg></button>
        </div>
      </header>

      <section class="thread" id="thread">
        <div class="empty-state" id="emptyState">
          <div class="empty-art" id="emptyArt"></div>
          <h1 id="emptyTitle">今天想构建什么？</h1>
          <p id="emptyCopy">Claude Code 会在你的 Linux 环境里读取文件、运行命令，并保留完整会话。</p>
          <div class="suggestions" id="suggestions"></div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
        <button class="jump-latest" id="jumpLatest" hidden><svg class="icon"><use href="#i-chevron-down"/></svg>回到最新</button>
      </section>

      <footer class="composer-dock">
        <div class="working-line" id="workingLine" hidden>
          <span class="working-spinner"></span>
          <span id="workingText">正在工作…</span>
          <button id="workingStop">停止</button>
        </div>
        <div class="composer" id="composer">
          <div class="attachments" id="attachments" hidden></div>
          <div class="composer-input-row">
            <textarea id="prompt" rows="1" placeholder="Describe a task or ask a question" spellcheck="false" enterkeyhint="send"></textarea>
            <div class="slash-menu" id="slashMenu" hidden></div>
          </div>
          <div class="composer-toolbar">
            <button class="tool-btn attach-btn" id="attachButton" aria-label="添加图片"><svg class="icon"><use href="#i-paperclip"/></svg></button>
            <button class="chip mode-chip" id="modeChip" hidden>
              <span class="chip-icon" id="modeIcon"></span>
              <span id="modeLabel">Manual</span>
              <svg class="icon chevron"><use href="#i-chevron-down"/></svg>
            </button>
            <div class="toolbar-space"></div>
            <button class="chip model-chip" id="modelChip" hidden>
              <span id="modelLabel">Model</span>
              <span class="chip-divider"></span>
              <span id="effortLabel"></span>
              <svg class="icon chevron"><use href="#i-chevron-down"/></svg>
            </button>
            <button class="send-btn" id="sendButton" aria-label="发送">
              <svg class="icon send-glyph"><use href="#i-arrow-up"/></svg>
              <svg class="icon stop-glyph"><use href="#i-stop"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-foot">
          <span id="composerHint">Enter 发送 · Shift+Enter 换行</span>
          <span class="context-meter" id="contextMeter"></span>
        </div>
      </footer>
    </main>

    <div class="sheet-layer" id="sheetLayer" hidden>
      <div class="sheet-scrim" data-close-sheet></div>
      <section class="sheet" id="sheet" role="dialog" aria-modal="true">
        <div class="sheet-grip"></div>
        <div class="sheet-head">
          <div>
            <div class="sheet-kicker" id="sheetKicker"></div>
            <h2 id="sheetTitle"></h2>
          </div>
          <button class="icon-btn" id="sheetClose" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </section>
    </div>

    <div class="menu-layer" id="moreMenu" hidden>
      <button data-menu="details"><svg class="icon"><use href="#i-info"/></svg><span>会话详情</span></button>
      <button data-menu="cwd"><svg class="icon"><use href="#i-folder"/></svg><span>更改工作目录</span></button>
      <button data-menu="account"><svg class="icon"><use href="#i-lock"/></svg><span>账号与登录</span></button>
      <button data-menu="theme"><svg class="icon"><use href="#i-moon"/></svg><span>切换外观</span></button>
      <button data-menu="reconnect"><svg class="icon"><use href="#i-refresh"/></svg><span>重新连接 CLI</span></button>
      <button data-menu="logs"><svg class="icon"><use href="#i-terminal"/></svg><span>诊断日志</span></button>
    </div>

    <div class="toast" id="toast" hidden></div>
    <div class="banner" id="banner" hidden>
      <span id="bannerText"></span>
      <button id="bannerAction" hidden></button>
    </div>
    <input id="fileInput" type="file" accept="image/*" multiple hidden>
  </div>
  <script src="/app.js"></script>
</body>
</html>
